services:
  - type: web
    name: sap-cpi-doc-automation
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:web
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
